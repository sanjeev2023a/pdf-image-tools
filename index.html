<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PDF &amp; Image Studio</title>
<style>
:root{
  --bg:#05070F;
  --bg2:#0A0F1F;
  --card:rgba(255,255,255,.055);
  --card-hi:rgba(255,255,255,.095);
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(255,255,255,.18);
  --text:#EEF1FA;
  --muted:#8B93AE;
  --brand:#7C5CFF;
  --brand-2:#22D3EE;
  --ok:#34D399;
  --danger:#FB7185;
  --r:20px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
input,select,textarea{-webkit-user-select:text;user-select:text}

.app{
  position:relative;display:flex;flex-direction:column;
  height:100vh;height:100dvh;max-width:540px;margin:0 auto;overflow:hidden;
}

/* animated background */
.aurora{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.55}
.aurora i:nth-child(1){width:70%;height:45%;left:-18%;top:-12%;background:radial-gradient(circle,#6D4BFF,transparent 70%);animation:float1 16s ease-in-out infinite}
.aurora i:nth-child(2){width:65%;height:40%;right:-22%;top:8%;background:radial-gradient(circle,#0E7C9E,transparent 70%);animation:float2 19s ease-in-out infinite}
.aurora i:nth-child(3){width:80%;height:50%;left:5%;bottom:-25%;background:radial-gradient(circle,#4B2FCF,transparent 72%);animation:float3 22s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(12%,10%,0) scale(1.18)}}
@keyframes float2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-14%,12%,0) scale(.9)}}
@keyframes float3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8%,-12%,0) scale(1.15)}}

/* top bar */
.topbar{
  position:relative;z-index:3;flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:14px 16px 10px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{
  width:36px;height:36px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#8B7BFF,#5B4BE8 55%,#22D3EE);
  box-shadow:0 10px 26px rgba(109,93,246,.42);
  animation:markIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes markIn{from{opacity:0;transform:scale(.7) rotate(-12deg)}to{opacity:1;transform:none}}
.brand-mark svg{width:19px;height:19px}
.brand-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
.pill{
  flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:#C9C2FF;
  padding:5px 9px;border-radius:99px;border:1px solid rgba(124,92,255,.35);
  background:rgba(124,92,255,.12);
}
.icon-btn{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);color:var(--text);cursor:pointer;padding:0;
  transition:transform .16s ease,background .2s ease;
}
.icon-btn:active{transform:scale(.92);background:var(--card-hi)}
.icon-btn svg{width:18px;height:18px}

/* content */
main{
  position:relative;z-index:2;flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scrollbar-width:none;
  padding:6px 16px 18px;
}
main::-webkit-scrollbar{display:none}
.screen{display:none}
.screen.active{display:block;animation:screenIn .34s cubic-bezier(.22,1,.36,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}

/* stagger */
.stagger>*{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}
.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}
.stagger>*:nth-child(8){animation-delay:.37s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* ripple */
.tap{position:relative;overflow:hidden}
.ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);
  transform:scale(0);animation:rippleOut .62s ease-out forwards;
}
@keyframes rippleOut{to{transform:scale(2.4);opacity:0}}

/* home */
#s-home.active{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.home-wrap{display:flex;flex-direction:column;gap:14px;padding:4px 0 8px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero-card{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;cursor:pointer;
  padding:22px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(165deg,rgba(255,255,255,.095),rgba(255,255,255,.025));
  color:var(--text);font:inherit;
  transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .25s ease,box-shadow .25s ease;
  box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
}
.hero-card:active{transform:scale(.965);border-color:rgba(124,92,255,.5)}
.hero-card::before{
  content:'';position:absolute;inset:-40% 30% 60% -40%;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,255,.35),transparent 70%);opacity:.9;pointer-events:none;
}
.hero-card.img::before{background:radial-gradient(circle,rgba(34,211,238,.30),transparent 70%)}
.hero-ic{
  position:relative;width:62px;height:62px;border-radius:19px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#8B7BFF,#5B4BE8);
  box-shadow:0 14px 30px rgba(109,93,246,.45);
}
.hero-card.img .hero-ic{background:linear-gradient(145deg,#22D3EE,#3B82F6);box-shadow:0 14px 30px rgba(34,211,238,.32)}
.hero-ic svg{width:29px;height:29px}
.hero-label{position:relative;font-size:15px;font-weight:700;letter-spacing:.3px}
.hero-count{position:relative;font-size:11px;color:var(--muted);letter-spacing:.4px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:4px}
.tile{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;cursor:pointer;
  padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  color:var(--text);font:inherit;text-align:left;min-height:108px;
  transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .22s ease,background .22s ease;
}
.tile:active{transform:scale(.96);border-color:rgba(124,92,255,.5);background:var(--card-hi)}
.tile-ic{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.30);color:#C6BCFF;
}
.tile-ic svg{width:20px;height:20px}
.tile-label{font-size:13.5px;font-weight:600;letter-spacing:.2px;line-height:1.25}

/* tool screen */
.tool-head{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.tool-head h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.tool-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.tool-sub{font-size:11.5px;color:var(--muted);line-height:1.35}
.tool-ic{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.30);color:#C6BCFF;
}
.tool-ic svg{width:21px;height:21px}

.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:28px 18px;border-radius:22px;text-align:center;cursor:pointer;
  border:1.5px dashed rgba(255,255,255,.17);background:rgba(255,255,255,.028);
  transition:border-color .22s ease,background .22s ease,transform .18s ease;
}
.drop:active,.drop.over{border-color:rgba(124,92,255,.8);background:rgba(124,92,255,.10);transform:scale(.995)}
.drop-ic{
  width:54px;height:54px;border-radius:17px;display:grid;place-items:center;
  background:rgba(124,92,255,.16);color:#C6BCFF;animation:bob 3.2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.drop-ic svg{width:24px;height:24px}
.drop-txt{font-size:14px;font-weight:600}
.drop-sub{font-size:11.5px;color:var(--muted)}

.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-size:12.5px;
  background:var(--card);border:1px solid var(--line);animation:rise .35s cubic-bezier(.22,1,.36,1) both;
}
.chip-ic{flex:0 0 auto;display:grid;place-items:center;color:#C6BCFF}
.chip-ic svg{width:16px;height:16px}
.chip-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-size{flex:0 0 auto;font-size:11px;color:var(--muted)}
.chip-x{flex:0 0 auto;display:grid;place-items:center;padding:5px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px}
.chip-x:active{background:rgba(255,255,255,.08)}
.chip-x svg{width:15px;height:15px}

.opt{display:flex;flex-direction:column;gap:10px;margin-top:16px;animation:rise .4s cubic-bezier(.22,1,.36,1) both}
.opt-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.seg{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:15px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;
  font-size:12.5px;font-weight:600;padding:9px 4px;border-radius:11px;cursor:pointer;
  transition:background .2s ease,color .2s ease,box-shadow .2s ease,transform .15s ease;
}
.seg button:active{transform:scale(.96)}
.seg button.on{color:#fff;background:linear-gradient(140deg,#8B7BFF,#5B4BE8);box-shadow:0 8px 18px rgba(109,93,246,.38)}

.field{display:block;margin-top:10px}
input[type=text],input[type=number],select{
  width:100%;padding:13px 14px;border-radius:14px;font:inherit;font-size:16px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none;
  transition:border-color .2s ease,box-shadow .2s ease;
}
input::placeholder{color:rgba(255,255,255,.28)}
input:focus,select:focus{border-color:rgba(124,92,255,.75);box-shadow:0 0 0 3px rgba(124,92,255,.16)}
select{
  appearance:none;-webkit-appearance:none;padding-right:34px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B93AE' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:16px;
}
.size-row{display:grid;grid-template-columns:1fr 100px;gap:10px}

.primary{
  position:relative;overflow:hidden;width:100%;margin-top:20px;padding:16px;border:0;border-radius:16px;
  cursor:pointer;font:inherit;font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#8B7BFF,#5B4BE8 55%,#4F46E5);
  box-shadow:0 14px 30px rgba(91,75,232,.38);
  transition:transform .16s cubic-bezier(.22,1,.36,1),opacity .25s ease,box-shadow .25s ease;
}
.primary:disabled{opacity:.4;box-shadow:none;cursor:default}
.primary:active:not(:disabled){transform:scale(.975)}

.prog{display:flex;align-items:center;gap:12px;margin-top:16px;animation:rise .3s ease both}
.prog-bar{flex:1;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}
.prog-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#8B7BFF,#22D3EE,#8B7BFF);background-size:200% 100%;
  animation:slide 1.1s linear infinite;transition:width .25s ease;
}
@keyframes slide{from{background-position:0 0}to{background-position:-200% 0}}
.prog-pct{min-width:40px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.result{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.res-card{
  display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;
  background:linear-gradient(160deg,rgba(52,211,153,.12),rgba(52,211,153,.05));
  border:1px solid rgba(52,211,153,.28);
  animation:pop .38s cubic-bezier(.22,1,.36,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.res-ok{flex:0 0 auto;display:grid;place-items:center;color:var(--ok)}
.res-ok svg{width:22px;height:22px}
.res-ok svg circle,.res-ok svg path{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .7s ease forwards}
.res-ok svg path{animation-delay:.25s}
@keyframes draw{to{stroke-dashoffset:0}}
.res-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.res-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-size{font-size:11px;color:var(--muted)}
.res-dl,.res-open,.res-share{
  flex:0 0 auto;width:40px;height:40px;border:0;border-radius:13px;cursor:pointer;
  display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#8B7BFF,#5B4BE8);
  transition:transform .15s ease;
}
.res-dl:active,.res-open:active,.res-share:active{transform:scale(.9)}
.res-open,.res-share{background:rgba(255,255,255,.10);border:1px solid var(--line-hi)}
.res-dl svg,.res-open svg,.res-share svg{width:18px;height:18px}

/* dock */
.dock{
  position:relative;z-index:3;flex:0 0 auto;
  display:flex;flex-direction:column;gap:8px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,7,15,0),rgba(5,7,15,.92) 45%);
}
.dock-btn{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;
  height:42px;border-radius:14px;text-decoration:none;font-size:12.5px;font-weight:600;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  transition:transform .16s ease,background .2s ease,border-color .2s ease;
}
.dock-btn:active{transform:scale(.98);background:rgba(255,255,255,.09);border-color:var(--line-hi)}
.dock-ic{display:grid;place-items:center}
.dock-ic svg{width:17px;height:17px}
.dock-btn.tg .dock-ic{color:#3FA9F5}
.dock-btn.ig .dock-ic{color:#E1306C}
.dev{
  text-align:center;font-size:10.5px;letter-spacing:.3px;color:rgba(255,255,255,.28);
}
.dev b{color:rgba(255,255,255,.45);font-weight:600}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:60;
  max-width:calc(100% - 40px);padding:11px 16px;border-radius:13px;text-align:center;
  font-size:12.5px;color:#fff;background:rgba(18,22,38,.97);border:1px solid var(--line-hi);
  box-shadow:0 18px 44px rgba(0,0,0,.5);
  transition:opacity .24s ease,transform .24s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}

</style>

<body>
<div class="app">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="topbar">
    <button id="backBtn" class="icon-btn tap" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
      </span>
      <span class="brand-txt">
        <span class="brand-name">PDF &amp; Image</span>
        <span class="brand-sub">Studio</span>
      </span>
    </div>
    <span class="pill">v2.0</span>
  </header>

  <main id="main">
    <section id="s-home" class="screen active">
      <div class="home-wrap">
        <div class="hero-grid stagger">
          <button class="hero-card img tap" data-go="image">
            <span class="hero-ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.6"/><path d="m21 16-5-5-6 6-3-3-4 4"/></svg>
            </span>
            <span class="hero-label">Image</span>
            <span class="hero-count">2 tools</span>
          </button>
          <button class="hero-card tap" data-go="pdf">
            <span class="hero-ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M19 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h9l5 5v12a1 1 0 0 1-1 1Z"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
            </span>
            <span class="hero-label">PDF</span>
            <span class="hero-count">6 tools</span>
          </button>
        </div>
      </div>
    </section>

    <section id="s-pdf" class="screen">
      <div class="tiles stagger">
        <button class="tile tap" data-tool="merge">
          <span class="tile-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg></span>
          <span class="tile-label">Merge PDF</span>
        </button>
        <button class="tile tap" data-tool="cut">
          <span class="tile-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/><path d="M14.47 14.48 20 20"/><path d="M8.12 8.12 12 12"/></svg></span>
          <span class="tile-label">Cut PDF</span>
        </button>
        <button class="tile tap" data-tool="resizepdf">
          <span class="tile-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></span>
          <span class="tile-label">Resize PDF</span>
        </button>
        <button class="tile tap" data-tool="pdf2jpg">
          <span class="tile-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.6"/><path d="m21 16-5-5-6 6-3-3-4 4"/></svg></span>
          <span class="tile-label">PDF to JPG</span>
        </button>
        <button class="tile tap" data-tool="rotate">
          <span class="tile-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/></svg></span>
          <span class="tile-label">Rotate PDF</span>

          p.drawText(text, {
            x: w / 2 - (textW / 2) * Math.cos(ang) + (fs / 2) * Math.sin(ang),
            y: h / 2 - (textW / 2) * Math.sin(ang) - (fs / 2) * Math.cos(ang),
            size: fs,
            font: font,
            color: window.PDFLib.rgb(0.42, 0.42, 0.48),
            opacity: 0.32,
            rotate: window.PDFLib.degrees(45)
          });
          progress((i + 1) / pages.length * 90);
        });
        return doc.save();
      });
    }).then(function (bytes) {
      progress(100);
      return [{ name: base + '-watermark.pdf', blob: pdfBlob(bytes) }];
    });
  }

  function compressToTarget(img, targetBytes, progress) {
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    var MAXDIM = 4096;
    if (Math.max(w, h) > MAXDIM) {
      var sc = MAXDIM / Math.max(w, h);
      w = w * sc; h = h * sc;
    }
    var attempt = 0;
    function step() {
      if (attempt > 9 || w < 60 || h < 60) {
        return Promise.reject(new Error('Target size is too small for this image.'));
      }
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w));
      canvas.height = Math.max(1, Math.round(h));
      var ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      var lo = 0.3, hi = 0.95, best = null;
      var chain = Promise.resolve();
      for (var i = 0; i < 6; i++) {
        (function (idx) {
          chain = chain.then(function () {
            var q = (lo + hi) / 2;
            return canvasToBlob(canvas, 'image/jpeg', q).then(function (blob) {
              if (blob.size <= targetBytes) { best = blob; lo = q; } else { hi = q; }
              progress(Math.min(95, (attempt * 6 + idx + 1) / 60 * 100));
            });
          });
        })(i);
      }
      return chain.then(function () {
        if (best) { progress(100); return { blob: best, width: canvas.width, height: canvas.height }; }
        w = w * 0.8; h = h * 0.8; attempt++;
        return step();
      });
    }
    return step();
  }

  function runImgResize(files, opts, progress) {
    var file = files[0];
    return loadImage(file).then(function (img) {
      return compressToTarget(img, opts.targetBytes, progress);
    }).then(function (res) {
      return [{
        name: baseName(file.name) + '-' + Math.max(1, Math.round(res.blob.size / 1024)) + 'kb.jpg',
        blob: res.blob
      }];
    });
  }

  function runImg2Pdf(files, opts, progress) {
    requireLibs();
    var A4 = [595.28, 841.89];
    var M = 24;
    var out;
    return window.PDFLib.PDFDocument.create().then(function (doc) {
      out = doc;
      var chain = Promise.resolve();
      files.forEach(function (f, i) {
        chain = chain.then(function () {
          return loadImage(f).then(function (img) {
            var w = img.naturalWidth || img.width;
            var h = img.naturalHeight || img.height;
            var MAXDIM = 2200;
            if (Math.max(w, h) > MAXDIM) {
              var sc = MAXDIM / Math.max(w, h);
              w = w * sc; h = h * sc;
            }
            var canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(w));
            canvas.height = Math.max(1, Math.round(h));
            var ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            return canvasToBlob(canvas, 'image/jpeg', 0.92).then(function (blob) {
              return blob.arrayBuffer().then(function (ab) {
                return out.embedJpg(ab).then(function (emb) {
                  var s = Math.min((A4[0] - M * 2) / canvas.width, (A4[1] - M * 2) / canvas.height);
                  var dw = canvas.width * s, dh = canvas.height * s;
                  var page = out.addPage(A4);
                  page.drawImage(emb, {
                    x: (A4[0] - dw) / 2,
                    y: (A4[1] - dh) / 2,
                    width: dw, height: dh
                  });
                  progress((i + 1) / files.length * 92);
                });
              });
            });
          });
        });
      });
      return chain;
    }).then(function () { return out.save(); })
      .then(function (bytes) {
        progress(100);
        var name = files.length === 1 ? baseName(files[0].name) + '.pdf' : 'images.pdf';
        return [{ name: name, blob: pdfBlob(bytes) }];
      });
  }

  /* ---------------- tools ---------------- */
  var TOOLS = {
    merge: {
      title: 'Merge PDF',
      sub: 'Join 2 or more PDF files into one',
      icon: I.merge,
      accept: 'application/pdf,.pdf',
      multiple: true, min: 2, max: 30,
      action: 'Merge PDF',
      chipIcon: I.file,
      options: '',
      run: runMerge
    },
    cut: {
      title: 'Cut PDF',
      sub: 'Split pages, take a range, or delete pages',
      icon: I.cut,
      accept: 'application/pdf,.pdf',
      multiple: false, min: 1, max: 1,
      action: 'Cut PDF',
      chipIcon: I.file,
      options:
        '<div class="opt">' +
        '  <div class="opt-label">What to do</div>' +
        '  <div class="seg" id="cutMode">' +
        '    <button type="button" data-v="split" class="on">Split all</button>' +
        '    <button type="button" data-v="range">Take pages</button>' +
        '    <button type="button" data-v="delete">Delete</button>' +
        '  </div>' +
        '  <label class="field" id="pagesField" hidden>' +
        '    <input id="pagesInput" type="text" inputmode="numeric" autocomplete="off" placeholder="1-3, 5">' +
        '  </label>' +
        '</div>',
      onOptionChange: function (root) {
        var mode = segValue(root, '#cutMode');
        var field = $('#pagesField', root);
        if (field) field.hidden = mode === 'split';
        var inp = $('#pagesInput', root);
        if (inp) inp.placeholder = mode === 'delete' ? 'Pages to delete, like 2, 5-7' : 'Pages to keep, like 1-3, 5';
      },
      readOptions: function (root) {
        var mode = segValue(root, '#cutMode');
        var pages = mode === 'split' ? '' : ($('#pagesInput', root).value || '').trim();
        if (mode !== 'split' && !pages) throw new Error('Enter page numbers.');
        return { mode: mode, pages: pages };
      },
      run: runCut
    },
    resizepdf: {
      title: 'Resize PDF',
      sub: 'Change page size or make the file smaller',
      icon: I.resize,
      accept: 'application/pdf,.pdf',
      multiple: false, min: 1, max: 1,
      action: 'Resize PDF',
      chipIcon: I.file,
      options:
        '<div class="opt">' +
        '  <div class="opt-label">Page size</div>' +
        '  <div class="seg" id="psz">' +
        '    <button type="button" data-v="keep" class="on">Keep</button>' +
        '    <button type="button" data-v="a4">A4</button>' +
        '    <button type="button" data-v="letter">Letter</button>' +
        '  </div>' +
        '  <div class="opt-label">Compression</div>' +
        '  <div class="seg" id="pq">' +
        '    <button type="button" data-v="off" class="on">Off</button>' +
        '    <button type="button" data-v="low">Low</button>' +
        '    <button type="button" data-v="medium">Medium</button>' +
        '    <button type="button" data-v="high">High</button>' +
        '  </div>' +
        '</div>',
      readOptions: function (root) {
        return { pageSize: segValue(root, '#psz'), compression: segValue(root, '#pq') };
      },
      run: runResizePdf
    },
    pdf2jpg: {
      title: 'PDF to JPG',
      sub: 'Every page becomes a picture',
      icon: I.tojpg,
      accept: 'application/pdf,.pdf',
      multiple: false, min: 1, max: 1,
      action: 'Convert to JPG',
      chipIcon: I.file,
      options:
        '<div class="opt">' +
        '  <div class="opt-label">Image quality</div>' +
        '  <div class="seg" id="jq">' +
        '    <button type="button" data-v="low">Low</button>' +
        '    <button type="button" data-v="medium" class="on">Medium</button>' +
        '    <button type="button" data-v="high">High</button>' +
        '  </div>' +
        '</div>',
      readOptions: function (root) { return { quality: segValue(root, '#jq') }; },
      run: runPdf2Jpg
    },
    rotate: {
      title: 'Rotate PDF',
      sub: 'Turn all pages to the right angle',
      icon: I.rotate,
      accept: 'application/pdf,.pdf',
      multiple: false, min: 1, max: 1,
      action: 'Rotate PDF',
      chipIcon: I.file,
      options:
        '<div class="opt">' +
        '  <div class="opt-label">Turn by</div>' +
        '  <div class="seg" id="ang">' +
        '    <button type="button" data-v="90" class="on">90</button>' +
        '    <button type="button" data-v="180">180</button>' +
        '    <button type="button" data-v="270">270</button>' +
        '  </div>' +
        '</div>',
      readOptions: function (root) { return { angle: parseInt(segValue(root, '#ang'), 10) || 90 }; },
      run: runRotate
    },
    watermark: {
      title: 'Watermark',
      sub: 'Write your name over every page',
      icon: I.water,
      accept: 'application/pdf,.pdf',
      multiple: false, min: 1, max: 1,
      action: 'Add Watermark',
      chipIcon: I.file,
      options:
        '<div class="opt">' +
        '  <div class="opt-label">Watermark text</div>' +
        '  <input id="wmInput" type="text" autocomplete="off" maxlength="40" placeholder="For example: Sanjeev Kumar">' +
        '</div>',
      readOptions: function (root) {
        var v = ($('#wmInput', root).value || '').trim();
        if (!v) throw new Error('Type the watermark text.');
        if (v.length > 40) throw new Error('Keep it under 40 characters.');
        return { text: v };
      },
      run: runWatermark
    },
    imgresize: {
      title: 'Resize Image',
      sub: 'Make a photo exactly the size you need',
      icon: I.resize,
      accept: 'image/*',
      multiple: false, min: 1, max: 1,
      action: 'Resize Image',
      chipIcon: I.image,
      options:
        '<div class="opt">' +
        '  <div class="opt-label">Target size</div>' +
        '  <div class="size-row">' +
        '    <input id="sizeInput" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" placeholder="200">' +
        '    <select id="unitSel">' +
        '      <option value="kb">KB</option>' +
        '      <option value="mb">MB</option>' +
        '    </select>' +
        '  </div>' +
        '</div>',
      readOptions: function (root) {
        var v = parseFloat($('#sizeInput', root).value);
        var unit = $('#unitSel', root).value;
        if (!v || v <= 0) throw new Error('Type a target size, like 200.');
        var bytes = unit === 'mb' ? v * 1048576 : v * 1024;
        if (bytes < 10240) throw new Error('Minimum target is 10 KB.');
        return { targetBytes: Math.round(bytes) };
      },
      run: runImgResize
    },
    img2pdf: {
      title: 'Image to PDF',
      sub: 'Turn photos into one PDF file',
      icon: I.topdf,
      accept: 'image/*',
      multiple: true, min: 1, max: MAX_IMAGES,
      action: 'Create PDF',
      chipIcon: I.image,
      options: '',
      run: runImg2Pdf
    }
  };

  function segValue(root, sel) {
    var b = $(sel + ' button.on', root);
    return b ? b.dataset.v : null;
  }

  /* ---------------- navigation ---------------- */
  var screens = {
    home: $('#s-home'),
    pdf: $('#s-pdf'),
    image: $('#s-image'),
    tool: $('#s-tool')
  };
  var navStack = ['home'];

  function updateBack() {
    var show = navStack.length > 1;
    $('#backBtn').hidden = !show;
    if (tg && tg.BackButton) {
      try { show ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) { }
    }
  }
  function showScreen(name, push) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle('active', k === name);
    });
    if (push !== false && navStack[navStack.length - 1] !== name) navStack.push(name);
    updateBack();
    var main = $('#main');
    if (main) main.scrollTop = 0;
  }
  function back() {
    if (navStack.length <= 1) return;
    navStack.pop();
    showScreen(navStack[navStack.length - 1], false);
    haptic('light');
  }

  /* ---------------- tool screen ---------------- */
  var state = { tool: null, files: [], outputs: [] };

  function openTool(id) {
    var t = TOOLS[id];
    if (!t) return;
    state.tool = id;
    state.files = [];
    state.outputs = [];
    var root = screens.tool;
    root.innerHTML =
      '<div class="tool-head"><span class="tool-ic">' + t.icon + '</span>' +
      '<span class="tool-txt"><h1>' + esc(t.title) + '</h1><span class="tool-sub">' + esc(t.sub) + '</span></span></div>' +
      '<div class="drop tap" id="drop" role="button" tabindex="0">' +
      '  <span class="drop-ic">' + I.upload + '</span>' +
      '  <span class="drop-txt">Tap to upload</span>' +
      '  <span class="drop-sub">' + (t.accept.indexOf('pdf') > -1 ? 'PDF file, up to 100 MB' : 'Image file, up to 100 MB') + '</span>' +
      '</div>' +
      '<input id="fileInput" type="file" accept="' + t.accept + '"' + (t.multiple ? ' multiple' : '') + ' hidden>' +
      '<div class="files" id="files"></div>' +
      t.options +
      '<button class="primary tap" id="runBtn" disabled>' + esc(t.action) + '</button>' +
      '<div class="prog" id="prog" hidden><div class="prog-bar"><i id="progFill"></i></div><span class="prog-pct" id="progPct">0%</span></div>' +
      '<div class="result" id="result" hidden></div>';

    var input = $('#fileInput', root);
    var drop = $('#drop', root);

    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
    });
    input.addEventListener('change', function () {
      addFiles(Array.prototype.slice.call(input.files));
      input.value = '';
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files) {
        addFiles(Array.prototype.slice.call(e.dataTransfer.files));
      }
    });

    $('#runBtn', root).addEventListener('click', onRun);

    $$('.seg', root).forEach(function (seg) {
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b || !seg.contains(b)) return;
        $$('button', seg).forEach(function (x) { x.classList.toggle('on', x === b); });
        if (t.onOptionChange) t.onOptionChange(root);
      });
    });
    if (t.onOptionChange) t.onOptionChange(root);

    renderFiles();
    showScreen('tool');
  }

  function addFiles(list) {
    var t = TOOLS[state.tool];
    var accept = t.accept.split(',').map(function (s) { return s.trim().toLowerCase(); });
    var ok = list.filter(function (f) {
      return accept.some(function (a) {
        if (a.indexOf('/*') > -1) return (f.type || '').indexOf(a.slice(0, -1)) === 0;
        if (a.charAt(0) === '.') return f.name.toLowerCase().slice(-a.length) === a;
        return f.type === a;
      });
    });
    if (!ok.length) { toast('Please choose the right file type.'); return; }
    if (ok.some(function (f) { return f.size > MAX_BYTES; })) { toast('File is larger than 100 MB.'); return; }
    var next = t.multiple ? state.files.concat(ok) : ok.slice(0, 1);
    if (next.length > t.max) {
      next = next.slice(0, t.max);
      toast('Only ' + t.max + ' files allowed.');
    }
    state.files = next;
    haptic('light');
    renderFiles();
  }

  function renderFiles() {
    var t = TOOLS[state.tool];
    var box = $('#files');
    if (!box) return;
    box.innerHTML = state.files.map(function (f, i) {
      return '<div class="chip">' +
        '<span class="chip-ic">' + (t.chipIcon || I.file) + '</span>' +
        '<span class="chip-name">' + esc(f.name) + '</span>' +
        '<span class="chip-size">' + fmtSize(f.size) + '</span>' +
        '<button class="chip-x" type="button" data-i="' + i + '" aria-label="Remove">' + I.x + '</button>' +
        '</div>';
    }).join('');
    var runBtn = $('#runBtn');
    if (runBtn) runBtn.disabled = state.files.length < t.min;
  }

  function onRun() {
    var t = TOOLS[state.tool];
    var root = screens.tool;
    var runBtn = $('#runBtn', root);
    var prog = $('#prog', root);
    var fill = $('#progFill', root);
    var pct = $('#progPct', root);
    var result = $('#result', root);
    var opts = {};

    try {
      opts = t.readOptions ? t.readOptions(root) : {};
    } catch (e) {
      toast(e.message);
      return;
    }

    haptic('medium');
    result.hidden = true;
    result.innerHTML = '';
    prog.hidden = false;
    fill.style.width = '0%';
    pct.textContent = '0%';
    runBtn.disabled = true;

    function setP(v) {
      var p = Math.max(0, Math.min(100, Math.round(v || 0)));
      fill.style.width = p + '%';
      pct.textContent = p + '%';
    }

    var job;
    try {
      job = Promise.resolve(t.run(state.files.slice(), opts, setP));
    } catch (e) {
      job = Promise.reject(e);
    }

    job.then(function (outputs) {
      setP(100);
      state.outputs = (outputs || []).map(function (o) {
        return { name: brandName(o.name), blob: o.blob };
      });
      showResult(state.outputs);
      haptic('light');
    }).catch(function (err) {
      toast((err && err.message) ? err.message : 'Something went wrong.');
    }).then(function () {
      prog.hidden = true;
      runBtn.disabled = state.files.length < t.min;
    });
  }

  function showResult(outputs) {
    var result = $('#result');
    if (!outputs.length) { toast('Nothing was created.'); return; }
    result.innerHTML = outputs.map(function (o, i) {
      return '<div class="res-card">' +
        '<span class="res-ok">' + I.check + '</span>' +
        '<div class="res-meta">' +
        '  <span class="res-name">' + esc(o.name) + '</span>' +
        '  <span class="res-size">' + fmtSize(o.blob.size) + ' · ready</span>' +
        '</div>' +
        '<button class="res-share" type="button" data-share="' + i + '" aria-label="Share">' + I.share + '</button>' +
        '<button class="res-open" type="button" data-open="' + i + '" aria-label="Open">' + I.external + '</button>' +
        '<button class="res-dl" type="button" data-i="' + i + '" aria-label="Download">' + I.download + '</button>' +
        '</div>';
    }).join('');
    result.hidden = false;
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { showScreen(go.dataset.go); return; }

    var tool = e.target.closest('[data-tool]');
    if (tool) { openTool(tool.dataset.tool); return; }

    var dl = e.target.closest('.res-dl');
    if (dl) {
      var o = state.outputs[parseInt(dl.dataset.i, 10)];
      if (o) saveBlob(o.blob, o.name);
      return;
    }
    var sh = e.target.closest('.res-share');
    if (sh) {
      var so = state.outputs[parseInt(sh.dataset.share, 10)];
      if (so) shareBlob(so.blob, so.name);
      return;
    }
    var op = e.target.closest('.res-open');
    if (op) {
      var po = state.outputs[parseInt(op.dataset.open, 10)];
      if (po) {
        var url = URL.createObjectURL(po.blob);
        window.open(url, '_blank');
        setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
      }
      return;
    }
    var rm = e.target.closest('.chip-x');
    if (rm) {
      state.files.splice(parseInt(rm.dataset.i, 10), 1);
      renderFiles();
      return;
    }
  });

  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.tap');
    if (!el) return;
    var r = el.getBoundingClientRect();
    var size = Math.max(r.width, r.height) * 1.1;
    var d = document.createElement('span');
    d.className = 'ripple';
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.left = (e.clientX - r.left - size / 2) + 'px';
    d.style.top = (e.clientY - r.top - size / 2) + 'px';
    el.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 640);
    haptic('light');
  }, { passive: true });

  $('#backBtn').addEventListener('click', back);
  if (tg && tg.BackButton) {
    try { tg.BackButton.onClick(back); } catch (e) { }
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') back();
  });

  updateBack();
})();

</script>
